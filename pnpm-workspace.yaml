packages:
  - "packages/*"

# pnpm 11 exige declarar qué paquetes pueden correr scripts de instalación.
# esbuild sí: linkea su binario nativo y sin él no arrancan vitest ni tsx.
# vue-demi sí: su postinstall elige el shim de Vue 2 o Vue 3 según la versión
# instalada, y sin correrlo las dependencias que lo usan importan el archivo
# equivocado.
allowBuilds:
  esbuild: true
  vue-demi: true
